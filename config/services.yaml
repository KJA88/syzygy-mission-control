schema_version: 1

# Live inventory captured 2026-09-23.
# Only values proven by machine-local inventory are filled in.
# Public routes, tool counts, safe probe tools, and auth remain VERIFY_LIVE where not yet proven.

nodes:
  - id: pi
    display_name: Raspberry Pi
    required: false
    agent: VERIFY_LIVE_PI_AGENT
    host: 192.168.1.18
    hostname: RasPi
    os: Debian GNU/Linux 13 (trixie)
    architecture: arm64
    interval_s: 30
    verified_live: 2026-09-23

  - id: jetson
    display_name: Jetson
    required: false
    agent: VERIFY_LIVE_JETSON_AGENT
    host: 192.168.1.17
    hostname: Jetson
    os: Ubuntu 22.04.5 LTS
    architecture: arm64
    hardware: NVIDIA Jetson Orin Nano Engineering Reference Developer Kit Super
    interval_s: 30
    verified_live: 2026-09-23

services:
  - id: dhras-dashboard
    display_name: DHRAS Dashboard
    host: jetson
    required: false
    systemd_unit: vision-dashboard.service
    local_url: http://127.0.0.1:8080
    health_url: http://127.0.0.1:8080/api/cameras/status
    public_url: VERIFY_LIVE
    public_required: false
    timeout_s: 3
    interval_s: 30
    dependencies: [dhras-vision-service]
    verified_live: 2026-09-23

  - id: dhras-vision-service
    display_name: DHRAS Vision Service
    host: jetson
    required: false
    # vision_service.py is live on :8081, but vision-hub.service was inactive during inventory.
    # Treat process/HTTP health as authoritative until startup ownership is resolved.
    systemd_unit: vision-hub.service
    systemd_unit_authoritative: false
    process_match: /home/KA_JET/robotics/jetson-vision/vision_service.py
    local_url: http://127.0.0.1:8081
    health_url: http://127.0.0.1:8081/health
    public_url: VERIFY_LIVE
    public_required: false
    timeout_s: 3
    interval_s: 30
    dependencies: []
    verified_live: 2026-09-23

  - id: dhras-mcp
    display_name: DHRAS MCP
    host: jetson
    required: false
    systemd_unit: dhras-mcp.service
    local_url: http://127.0.0.1:8020
    mcp_path: VERIFY_LIVE
    public_url: VERIFY_LIVE
    public_required: false
    expected_tools: VERIFY_LIVE
    allowed_probe_tool: VERIFY_LIVE
    timeout_s: 5
    interval_s: 30
    auth_probe: off
    dependencies: [dhras-vision-service]
    verified_live: 2026-09-23

  - id: fitbit-mcp
    display_name: Fitbit MCP
    host: pi
    required: false
    systemd_unit: fitbit-mcp.service
    local_url: http://127.0.0.1:8010
    mcp_path: /mcp
    public_url: https://fitbit.syzygylab.net
    public_route_status: VERIFY_LIVE
    cloudflared_unit: cloudflared-fitbit-mcp.service
    public_required: false
    expected_tools: VERIFY_LIVE
    allowed_probe_tool: VERIFY_LIVE_SAFE_READ_ONLY_TOOL
    timeout_s: 5
    interval_s: 60
    auth_probe: off
    dependencies: []
    verified_live: 2026-09-23

  - id: tv-mcp
    display_name: TV MCP
    host: pi
    required: false
    systemd_unit: tv-mcp.service
    local_url: http://127.0.0.1:8065
    mcp_path: /mcp
    public_url: VERIFY_LIVE
    cloudflared_unit: cloudflared-tv-mcp.service
    public_required: false
    expected_tools: 7
    expected_tool_names:
      - tv_dashboard
      - tv_cable
      - tv_set_input_state
      - tv_wall_cameras
      - tv_wall_status
      - tv_wall_page
      - tv_off
    # Live tools/list verified all registered tools are action/state-changing.
    # Guardian therefore must not use tools/call for routine health ticks.
    allowed_probe_tool: null
    probe:
      type: mcp_initialize
      protocol_version: "2024-11-05"
      accept: "application/json, text/event-stream"
      catalog_check: tools/list
      catalog_mismatch_status: YELLOW
      tool_calls_allowed: false
      live_initialize_verified: 2026-09-23T23:05:21Z
      live_catalog_verified: 2026-09-23T23:07:00Z
      response_content_type: text/event-stream
      session_header: mcp-session-id
      server_info:
        name: tv-mcp
        version: "1.30.0"
    timeout_s: 5
    interval_s: 30
    auth_probe: off
    dependencies: []
    verified_live: 2026-09-23

  - id: pi-git-mcp
    display_name: Pi Git Audit MCP
    host: pi
    required: false
    systemd_unit: VERIFY_LIVE
    process_match: /home/KA_PI/git-audit-mcp/git-audit-mcp/server.py
    local_url: http://127.0.0.1:8000
    mcp_path: VERIFY_LIVE
    public_url: VERIFY_LIVE
    cloudflared_unit: cloudflared-pi-git-mcp.service
    public_required: false
    expected_tools: VERIFY_LIVE
    allowed_probe_tool: VERIFY_LIVE
    timeout_s: 5
    interval_s: 60
    auth_probe: off
    dependencies: []
    verified_live: 2026-09-23

  - id: polar-h10-mcp
    display_name: Polar H10 MCP
    host: pi
    required: false
    systemd_unit: VERIFY_LIVE
    process_match: /home/KA_PI/polar-h10/mcp_server.py
    local_url: http://127.0.0.1:8030
    mcp_path: VERIFY_LIVE
    public_url: VERIFY_LIVE
    cloudflared_unit: cloudflared-polar-h10-mcp.service
    public_required: false
    expected_tools: VERIFY_LIVE
    allowed_probe_tool: VERIFY_LIVE
    timeout_s: 5
    interval_s: 60
    auth_probe: off
    dependencies: []
    verified_live: 2026-09-23

  - id: jetson-git-mcp
    display_name: Jetson Git Audit MCP
    host: jetson
    required: false
    systemd_unit: VERIFY_LIVE
    process_match: /home/KA_JET/git-audit-mcp/git-audit-mcp/server.py
    local_url: http://127.0.0.1:8000
    mcp_path: VERIFY_LIVE
    public_url: VERIFY_LIVE
    cloudflared_unit: cloudflared-jetson-git-mcp.service
    public_required: false
    expected_tools: VERIFY_LIVE
    allowed_probe_tool: VERIFY_LIVE
    timeout_s: 5
    interval_s: 60
    auth_probe: off
    dependencies: []
    verified_live: 2026-09-23

paths:
  - id: cloudflare-pi
    display_name: Pi Cloudflare Tunnel Inventory
    host: pi
    required: false
    units:
      - cloudflared-fitbit-mcp.service
      - cloudflared-pi-git-mcp.service
      - cloudflared-polar-h10-mcp.service
      - cloudflared-tv-mcp.service
    routes: VERIFY_LIVE
    verified_live: 2026-09-23

  - id: cloudflare-jetson
    display_name: Jetson Cloudflare Tunnel Inventory
    host: jetson
    required: false
    units:
      - cloudflared-jetson-git-mcp.service
      - cloudflared.service
    routes: VERIFY_LIVE
    verified_live: 2026-09-23

  - id: unified-mcp-portal
    display_name: Unified MCP Portal
    required: false
    url: VERIFY_LIVE
    catalog_behavior: VERIFY_LIVE
