    systemd_unit: git-audit-mcp.service
    process_match: /home/KA_JET/git-audit-mcp/git-audit-mcp/server.py
    local_url: http://127.0.0.1:8000
    mcp_path: /mcp
    public_url: https://jetson-git.syzygylab.net
    public_mcp_path: /mcp
