schema_version: 1

guardian:
  interval_s: 30
  agent_fresh_s: 60
  agent_unknown_s: 90
  heartbeat_unknown_s: 120
  observation_unknown_s: 90

# Live inventory captured 2026-09-23.
# Catalog fingerprint = SHA-256 of sorted tool names joined with "\n" (UTF-8).
# Public MCP routes below were protocol-tested with initialize + tools/list.

nodes:
  - id: pi
    display_name: Raspberry Pi
    required: false
    agent: VERIFY_LIVE_PI_AGENT
    agent_bind: 192.168.1.18
    agent_port: 9071
    agent_candidate_url: http://192.168.1.18:9071/health
    host: 192.168.1.18
    hostname: RasPi
    os: Debian GNU/Linux 13 (trixie)
    architecture: arm64
    interval_s: 30
    verified_live: 2026-09-23

  - id: jetson
    display_name: Jetson
    required: false
    agent: VERIFY_LIVE_JETSON_AGENT
    agent_bind: 192.168.1.17
    agent_port: 9071
    agent_candidate_url: http://192.168.1.17:9071/health
    host: 192.168.1.17
    hostname: Jetson
    os: Ubuntu 22.04.5 LTS
    architecture: arm64
    hardware: NVIDIA Jetson Orin Nano Engineering Reference Developer Kit Super
    interval_s: 30
    verified_live: 2026-09-23

services:
  - id: dhras-dashboard
    display_name: DHRAS Dashboard
    host: jetson
    required: false
    systemd_unit: vision-dashboard.service
    local_url: http://127.0.0.1:8080
    health_url: http://127.0.0.1:8080/api/cameras/status
    public_url: VERIFY_LIVE
    public_required: false
    timeout_s: 3
    interval_s: 30
    dependencies: [dhras-vision-service]
    verified_live: 2026-09-23

  - id: dhras-vision-service
    display_name: DHRAS Vision Service
    host: jetson
    required: false
    systemd_unit: vision-hub.service
    systemd_unit_authoritative: false
    process_match: /home/KA_JET/robotics/jetson-vision/vision_service.py
    local_url: http://127.0.0.1:8081
    health_url: http://127.0.0.1:8081/health
    cameras:
      - id: frontyard
        required: true
        health_url: http://127.0.0.1:8081/status/frontyard
      - id: backyard
        required: true
        health_url: http://127.0.0.1:8081/status/backyard
      - id: indoor
        required: true
        health_url: http://127.0.0.1:8081/status/indoor
    public_url: VERIFY_LIVE
    public_required: false
    timeout_s: 3
    interval_s: 30
    dependencies: []
    verified_live: 2026-09-23

  - id: dhras-mcp
    display_name: DHRAS MCP
    host: jetson
    required: false
    systemd_unit: dhras-mcp.service
    local_url: http://127.0.0.1:8020
    mcp_path: /mcp
    public_url: https://dhras.syzygylab.net
    public_mcp_path: /mcp
    public_verified: 2026-09-23
    cloudflared_unit: cloudflared.service
    public_required: false
    expected_tools: 16
    expected_tool_names_sha256: fdca659fffa3692afb7d29f8d4fded17bd4cf066c7d518941539e282c1b1b7b3
    expected_tool_names:
      - get_camera_status
      - get_recent_events
      - get_recent_person_events
      - get_recent_vehicle_events
      - get_recent_animal_events
      - get_latest_detection
      - get_latest_detection_image
      - get_detection_count
      - list_detection_images
      - get_detection_image
      - get_detection_summary
      - get_detection_date_range
      - get_detection_storage_usage
      - get_detection_classes
      - get_detection_cameras
      - delete_detection_image
    allowed_probe_tool: get_camera_status
    probe:
      type: mcp_initialize
      protocol_version: "2024-11-05"
      catalog_check: tools/list
      catalog_mismatch_status: YELLOW
      tool_calls_allowed: false
      session_required: true
      optional_functional_probe: get_camera_status
      functional_probe_enabled: false
      server_info:
        name: DHRAS MCP
        version: ""
      live_catalog_verified: 2026-09-23
      public_catalog_verified: 2026-09-23
    timeout_s: 5
    interval_s: 30
    auth_probe: off
    dependencies: [dhras-vision-service]
    verified_live: 2026-09-23

  - id: fitbit-mcp
    display_name: Fitbit MCP
    host: pi
    required: false
    systemd_unit: fitbit-mcp.service
    local_url: http://127.0.0.1:8010
    mcp_path: /mcp
    public_url: https://fitbit.syzygylab.net
    public_mcp_path: /mcp
    public_verified: 2026-09-23
    cloudflared_unit: cloudflared-fitbit-mcp.service
    public_required: false
    expected_tools: 62
    expected_tool_names_sha256: f20ce697b699a9ba816e566968096e58fbfcdaefcd26f6bdbdf0773e1473614f
    allowed_probe_tool: get_fitbit_data_quality
    probe:
      type: mcp_initialize
      protocol_version: "2024-11-05"
      catalog_check: tools/list
      catalog_mismatch_status: YELLOW
      tool_calls_allowed: false
      session_required: false
      optional_functional_probe: get_fitbit_data_quality
      functional_probe_enabled: false
      server_info:
        name: Fitbit Health MCP
        version: ""
      live_catalog_verified: 2026-09-23
      public_catalog_verified: 2026-09-23
    timeout_s: 5
    interval_s: 60
    auth_probe: off
    dependencies: []
    verified_live: 2026-09-23

  - id: tv-mcp
    display_name: TV MCP
    host: pi
    required: false
    systemd_unit: tv-mcp.service
    local_url: http://127.0.0.1:8065
    mcp_path: /mcp
    public_url: https://tv.syzygylab.net
    public_mcp_path: /mcp
    public_verified: 2026-09-23
    cloudflared_unit: cloudflared-tv-mcp.service
    public_required: false
    expected_tools: 7
    expected_tool_names_sha256: abf514587a1dca62fb3181c50d801d0b45220decab23faa844f4e42b7db6dcdb
    expected_tool_names:
      - tv_dashboard
      - tv_cable
      - tv_set_input_state
      - tv_wall_cameras
      - tv_wall_status
      - tv_wall_page
      - tv_off
    allowed_probe_tool: null
    probe:
      type: mcp_initialize
      protocol_version: "2024-11-05"
      accept: "application/json, text/event-stream"
      catalog_check: tools/list
      catalog_mismatch_status: YELLOW
      tool_calls_allowed: false
      session_required: true
      live_initialize_verified: 2026-09-23T23:05:21Z
      live_catalog_verified: 2026-09-23T23:07:00Z
      public_catalog_verified: 2026-09-23
      response_content_type: text/event-stream
      session_header: mcp-session-id
      server_info:
        name: tv-mcp
        version: "1.30.0"
    timeout_s: 5
    interval_s: 30
    auth_probe: off
    dependencies: []
    verified_live: 2026-09-23

