paths:
  - id: cloudflare-pi
    display_name: Pi Cloudflare Tunnel Inventory
    host: pi
    required: false
    units:
      - cloudflared-fitbit-mcp.service
      - cloudflared-pi-git-mcp.service
      - cloudflared-polar-h10-mcp.service
      - cloudflared-tv-mcp.service
    routes:
      - https://fitbit.syzygylab.net/mcp
      - https://pi-git.syzygylab.net/mcp
      - https://polar.syzygylab.net/mcp
      - https://tv.syzygylab.net/mcp
    verified_live: 2026-09-23

  - id: cloudflare-jetson
    display_name: Jetson Cloudflare Tunnel Inventory
    host: jetson
    required: false
    units:
      - cloudflared-jetson-git-mcp.service
      - cloudflared.service
    routes:
      - https://jetson-git.syzygylab.net/mcp
      - https://dhras.syzygylab.net/mcp
    verified_live: 2026-09-23

  - id: unified-mcp-portal
    display_name: Unified MCP Portal
    required: false
    url: VERIFY_LIVE
    catalog_behavior: VERIFY_LIVE
