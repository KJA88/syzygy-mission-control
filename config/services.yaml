    cloudflared_unit: cloudflared-pi-git-mcp.service
    public_required: false
    expected_tools: 22
    expected_tool_names_sha256: 50ff456a285f2c762490adaa31d7ddf4d84de1fd7539c34e69bd6a22d1a184ad
